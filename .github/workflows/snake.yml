name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: zanjbeelsaeed
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg

          # 🌈 COLOR CUSTOMIZATION GOES HERE
          color_snake: "#00ffcc,#ff00ff,#ffff00,#00ff66,#ff3366"
          color_dots: "#161b22,#0e4429,#006d32,#26a641,#39d353"

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
